say_text:
  name: Say Text
  description: Make Vector speak text via the robot TTS engine.
  fields:
    text:
      required: true
      selector:
        text:
    device_id:
      required: false
      selector:
        device:
    use_vector_voice:
      required: false
      default: true
      selector:
        boolean:
    duration_scalar:
      required: false
      default: 1.0
      selector:
        number:
          min: 0.05
          max: 20.0
          step: 0.05
          mode: box
    pitch_scalar:
      required: false
      default: 0.0
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: box

set_eye_color:
  name: Set Eye Color
  description: Set Vector custom eye color using RGB values.
  fields:
    rgb_color:
      required: true
      selector:
        color_rgb:
    device_id:
      required: false
      selector:
        device:
